[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroglia"
version = "0.6.0"
description = "Tells Claude Code which skills and tools fit the task, what it already learned, and whether that is still true"
keywords = ["claude-code", "mcp", "agents", "memory", "context", "llm-tools"]
authors = [{ name = "Astroglia contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/ThyZ0/astroglia"
Issues = "https://github.com/ThyZ0/astroglia/issues"
Changelog = "https://github.com/ThyZ0/astroglia/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
astroglia = "astroglia.cli:main"

[tool.setuptools.packages.find]
include = ["astroglia*"]

[tool.setuptools.package-data]
astroglia = ["ui/*"]
